<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Cleaner</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2em;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      margin-bottom: 2em;
    }
    button {
      padding: 1em 2em;
      font-size: 1em;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
    .info {
      margin-top: 1.5em;
      font-size: 0.9em;
      color: #666;
      text-align: center;
    }
    #hiddenInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
    }
  </style>
</head>
<body>
  <h1>Text Cleaner</h1>
  <input id="hiddenInput" type="text" autocomplete="off" />
  <button onclick="cleanClipboard()">Bereinigen & Kopieren</button>
  <div class="info" id="status"></div>

  <script>
    async function cleanClipboard() {
      const hiddenInput = document.getElementById("hiddenInput");
      hiddenInput.focus();

      try {
        const text = await navigator.clipboard.readText();
        const cleaned = text
          .replace(/<[^>]*>/g, '')
          .replace(/[*_~`]/g, '')
          .replace(/\s+/g, ' ')
          .replace(/[\u200B-\u200D\uFEFF]/g, '')
          .trim();
        await navigator.clipboard.writeText(cleaned);
        document.getElementById("status").textContent = "Bereinigter Text wurde kopiert!";
      } catch (err) {
        document.getElementById("status").textContent = "Fehler beim Zugriff auf die Zwischenablage.";
      }
    }

    // Fokus beim Laden setzen (hilft auf iOS)
    window.addEventListener("load", () => {
      document.getElementById("hiddenInput").focus();
    });
  </script>
</body>
</html>
