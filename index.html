<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Cleaner</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2em;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      margin-bottom: 2em;
    }
    button {
      padding: 1em 2em;
      font-size: 1em;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
    .info {
      margin-top: 1.5em;
      font-size: 0.9em;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Text Cleaner</h1>
  <button onclick="cleanClipboard()">Bereinigen & Kopieren</button>
  <div class="info" id="status"></div>

  <script>
    function capitalizeAfterArticles(text) {
      const articlePattern = /\b(der|die|das|ein|eine|einen|einem|einer|dem|den|des)\s+([a-zäöüß])/gi;
      return text.replace(articlePattern, (_, article, firstLetter) => {
        return `${article} ${firstLetter.toUpperCase()}`;
      }).replace(/\b(der|die|das|ein|eine|einen|einem|einer|dem|den|des)\s+([A-ZÄÖÜ])([a-zäöüß]+)/g, (_, a, f, rest) => {
        return `${a} ${f}${rest}`;
      });
    }

    function capitalizeSentences(text) {
      return text.replace(/(^\s*\w|[.!?]\s*\w)/g, match => match.toUpperCase());
    }

    function removeDuplicateLines(text) {
      const lines = text.split('\n');
      const seen = new Set();
      return lines.filter(line => {
        const trimmed = line.trim();
        if (seen.has(trimmed)) return false;
        seen.add(trimmed);
        return true;
      }).join('\n');
    }

    async function cleanClipboard() {
      try {
        let text = await navigator.clipboard.readText();

        text = text
          .replace(/<[^>]*>/g, '') // HTML-Tags entfernen
          .replace(/[*_~`]/g, '') // Markdown-Symbole entfernen
          .replace(/[ \t]+/g, ' ') // Doppelte Leerzeichen/Tabs
          .replace(/\n{3,}/g, '\n\n') // Mehr als 2 Leerzeilen reduzieren
          .replace(/[\u200B-\u200D\uFEFF]/g, '') // Unsichtbare Zeichen
          .trim();

        text = removeDuplicateLines(text);
        text = capitalizeSentences(text);
        text = capitalizeAfterArticles(text);

        await navigator.clipboard.writeText(text);
        document.getElementById("status").textContent = "Bereinigter Text wurde kopiert!";
      } catch (err) {
        document.getElementById("status").textContent = "Fehler beim Zugriff auf die Zwischenablage.";
      }
    }
  </script>
</body>
</html>
