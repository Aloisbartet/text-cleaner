<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Cleaner</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2em;
      background: #f5f5f5;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1em;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 1em;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }
    button {
      margin-top: 1em;
      padding: 1em;
      width: 100%;
      font-size: 1em;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
    .info {
      margin-top: 1em;
      text-align: center;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Text Cleaner</h1>
  <textarea id="input" placeholder="Füge hier deinen Text ein..."></textarea>
  <button onclick="cleanText()">Bereinigen & Kopieren</button>
  <div class="info" id="status"></div>

  <script>
    function cleanText() {
      let text = document.getElementById("input").value;
      let cleaned = text
        .replace(/<[^>]*>/g, '')
        .replace(/[*_~`]/g, '')
        .replace(/\s+/g, ' ')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .trim();
      navigator.clipboard.writeText(cleaned).then(() => {
        document.getElementById("status").textContent = "Bereinigter Text wurde kopiert!";
      });
    }
  </script>
</body>
</html>
